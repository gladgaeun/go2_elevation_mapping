elevation_mapping:
  ros__parameters:
    use_sim_time: true
    plugin_config_file: '/home/airlab/go2_ws/install/elevation_mapping_cupy/share/elevation_mapping_cupy/config/core/plugin_config.yaml'
    weight_file: '/home/airlab/go2_ws/src/elevation_mapping_cupy/elevation_mapping_cupy/config/weights/weight.dat'

    enable_normal_color: false
    
    map_acquire_fps: 10.0
    publish_statistics_fps: 1.0
    update_variance_fps: 10.0
    update_pose_fps: 20.0

    # Map Settings
    resolution: 0.04
    map_length: 20.0
    sensor_noise_factor: 0.05
    mahalanobis_thresh: 2.0
    outlier_variance: 0.01
    initial_variance: 10.0
    initialized_variance: 10.0
    max_variance: 100.0
    time_variance: 0.0001
    time_interval: 0.1
    position_noise_thresh: 0.1
    orientation_noise_thresh: 0.1
    max_ray_length: 10.0
    cleanup_step: 0.04
    cleanup_cos_thresh: 0.5
    min_valid_distance: 0.1
    max_height_range: 5.0
    ramped_height_range_a: 0.3
    ramped_height_range_b: 1.0
    ramped_height_range_c: 0.2
    safe_thresh: 0.5
    safe_min_thresh: 0.5
    max_unsafe_n: 5
    wall_num_thresh: 10
    min_height_drift_cnt: 100
    traversability_inlier: 0.1
    drift_compensation_variance_inlier: 0.1
    drift_compensation_alpha: 0.1
    max_drift: 0.1
    overlap_clear_range_xy: 0.04
    overlap_clear_range_z: 0.1
    checker_layer: "elevation"
    average_weight: 0.5
    data_type: "float32"

    dilation_size: 2
    dilation_size_initialize: 2

    enable_edge_sharpen: false
    enable_drift_compensation: false
    enable_initial_drift_compensation: false
    enable_visibility_cleanup: true
    enable_overlap_clearance: true
    use_only_above_for_upper_bound: false
    use_chainer: false

    enable_pointcloud_publishing: false
    enable_normal_arrow_publishing: false
    enable_drift_corrected_TF_publishing: false
    use_initializer_at_start: false
    always_clear_with_initializer: false

    # Frames
    map_frame: "odom"
    robot_frame: "base_link"
    base_frame: "base_link"
    corrected_map_frame: "odom"
    initialize_frame_id: ["base_link"]
    initialize_tf_offset: [0.0, 0.0, 0.0]
    initialize_method: "nearest"
    pose_topic: ""

    pointcloud_channel_fusions:
      none: 'none'

    image_channel_fusions:
      rgb: 'color'
      default: 'exponential'

    # Subscribers (라이다 단독으로 먼저 안정화)
    subscribers:
      lidar_points:
        topic_name: '/point_cloud2'
        data_type: 'pointcloud'

    # Publishers (무지개 지도와 traversability 출력을 위한 레이어 모두 복원)
    publishers:
      elevation_map_raw:
        layers: ['elevation', 'variance', 'traversability']
        basic_layers: ['elevation', 'variance']
        fps: 10.0
      elevation_map_recordable:
        layers: ['elevation', 'traversability']
        basic_layers: ['elevation']
        fps: 5.0
